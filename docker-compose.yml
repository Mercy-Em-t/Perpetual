services:
  # 1. Perpetual Core Microservice (Flask Storefront + Dynamic Shop Pipelines)
  room-server:
    build:
      context: .
      dockerfile: Dockerfile.room
    container_name: perpetual-core-server
    ports:
      - "5050:5050"
    volumes:
      - ./agent_room.db:/app/agent_room.db
      - ./config:/app/config
      - ./templates:/app/templates
      - ./static:/app/static
      - ./docs:/app/docs
    environment:
      - PORT=5050
      - WHATSAPP_GATEWAY_URL=http://whatsapp-gateway:5174
    restart: unless-stopped
    networks:
      - perpetual-net

  # 2. Autonomous WhatsApp Workforce Gateway (Baileys + Supabase Multi-Tenant Routing)
  whatsapp-gateway:
    build:
      context: .
      dockerfile: Dockerfile.whatsapp
    container_name: perpetual-whatsapp-gateway
    ports:
      - "5174:5174"
    volumes:
      - ./whatsapp_gateway/.auth_whatsapp_baileys:/app/.auth_whatsapp_baileys
    env_file:
      - ./whatsapp_gateway/.env
    environment:
      - WHATSAPP_PORT=5174
      - WHATSAPP_AUTH_DIR=/app/.auth_whatsapp_baileys
      - ROOM_SERVER_URL=http://room-server:5050
    restart: unless-stopped
    networks:
      - perpetual-net

networks:
  perpetual-net:
    driver: bridge
